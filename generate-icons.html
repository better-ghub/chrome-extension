<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Better GitHub PR Icons</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f6f8fa;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #24292e;
        }
        .preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            align-items: center;
        }
        canvas {
            border: 1px solid #d1d5da;
            border-radius: 4px;
        }
        button {
            background: #2ea44f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2c974b;
        }
        .instructions {
            background: #fff8c5;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border: 1px solid #d4a72c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Generate Better GitHub PR Icons</h1>
        
        <div class="instructions">
            <strong>Instructions:</strong> Click the download buttons below to save each icon size. 
            Save them in the <code>icons/</code> folder with the exact names shown.
        </div>

        <div class="preview">
            <div>
                <h3>16x16</h3>
                <canvas id="canvas16" width="16" height="16"></canvas>
                <br>
                <button onclick="downloadIcon(16)">Download icon16.png</button>
            </div>
            <div>
                <h3>48x48</h3>
                <canvas id="canvas48" width="48" height="48"></canvas>
                <br>
                <button onclick="downloadIcon(48)">Download icon48.png</button>
            </div>
            <div>
                <h3>128x128</h3>
                <canvas id="canvas128" width="128" height="128"></canvas>
                <br>
                <button onclick="downloadIcon(128)">Download icon128.png</button>
            </div>
        </div>

        <button onclick="downloadAll()">📦 Download All Icons</button>
    </div>

    <script>
        // Load and render the SVG
        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#24292e"/>
  <g fill="#ffffff">
    <circle cx="35" cy="35" r="8"/>
    <circle cx="93" cy="93" r="8"/>
    <rect x="31" y="43" width="4" height="42" rx="2"/>
    <rect x="89" y="43" width="4" height="42" rx="2"/>
    <circle cx="64" cy="64" r="12"/>
    <path d="M 48 90 L 48 102 L 54 96 L 68 96 C 72 96 74 94 74 90 L 74 84 C 74 80 72 78 68 78 L 54 78 C 50 78 48 80 48 84 Z" fill="#28a745"/>
    <circle cx="95" cy="25" r="10" fill="#f85149"/>
  </g>
</svg>`;

        function renderIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
            };
            
            img.src = url;
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function downloadAll() {
            [16, 48, 128].forEach((size, index) => {
                setTimeout(() => downloadIcon(size), index * 500);
            });
        }

        // Render all icons on page load
        window.onload = function() {
            [16, 48, 128].forEach(size => renderIcon(size));
        };
    </script>
</body>
</html>

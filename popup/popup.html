<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Better GHub</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app" id="app" data-state="loading">
      <header class="app-header">
        <img class="app-logo" src="../icons/icon48.png" alt="" width="24" height="24" />
        <div class="app-title">
          <h1>Better GHub</h1>
          <span class="app-version" id="version"></span>
        </div>
        <div class="app-actions">
          <button
            type="button"
            class="btn btn-ghost btn-icon btn-sm"
            id="copy-summary"
            hidden
            data-tooltip-side="below"
            data-tooltip-align="end"
            data-i18n-attr="aria-label:popupCopySummary,data-tooltip:popupCopySummary"
            aria-label="Copy daily summary"
            data-tooltip="Copy daily summary"
          ></button>
          <button
            type="button"
            class="btn btn-ghost btn-icon btn-sm"
            id="refresh"
            hidden
            data-tooltip-side="below"
            data-tooltip-align="end"
            data-i18n-attr="aria-label:popupRefresh,data-tooltip:popupRefresh"
            aria-label="Refresh inbox"
            data-tooltip="Refresh inbox"
          ></button>
          <button
            type="button"
            class="btn btn-ghost btn-icon btn-sm"
            id="open-settings"
            data-tooltip-side="below"
            data-tooltip-align="end"
            data-i18n-attr="aria-label:popupSettings,data-tooltip:popupSettings"
            aria-label="Settings"
            data-tooltip="Settings"
          ></button>
        </div>
      </header>

      <main class="app-main" id="main" aria-busy="true"></main>

      <footer class="app-footer" id="footer">
        <div class="quick-toggles">
          <label class="quick-toggle">
            <input type="checkbox" role="switch" class="switch switch-sm" id="toggle-shortcuts" data-setting="shortcutsEnabled" />
            <span data-i18n="popupToggleShortcuts">Shortcuts</span>
          </label>
          <label class="quick-toggle">
            <input type="checkbox" role="switch" class="switch switch-sm" id="toggle-badge" data-setting="notificationsEnabled" />
            <span data-i18n="popupToggleBadge">Badge</span>
          </label>
        </div>
        <p class="footer-hint" id="shortcut-hint" hidden></p>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

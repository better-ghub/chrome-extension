<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__MSG_extensionName__</title>
    <link rel="stylesheet" href="https://unpkg.com/@primer/css@21.0.7/dist/primer.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="p-3" style="width: 350px; min-height: 200px">
      <div class="d-flex flex-justify-between flex-items-center mb-3">
        <h2 class="h3 m-0" style="background: linear-gradient(180deg, #6e40c9 0%, #3c1e70 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          Better GHub
        </h2>
        <span class="Label Label--primary" id="version" style="background: #6e40c9">v0.2.0</span>
      </div>

      <div id="auth-section" style="position: relative; min-height: 120px">
        <!-- Loading state -->
        <div id="loading-state" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <div class="anim-pulse text-center">
            <div class="AnimatedEllipsis"></div>
            <p class="text-small color-fg-muted mt-2">__MSG_loading__</p>
          </div>
        </div>

        <!-- Logged out -->
        <div id="logged-out" style="display: none">
          <div class="flash mb-3">
            <div class="d-flex flex-items-start">
              <span class="icon octicon-inline mr-2 mt-1"></span>
              <div class="flex-1">
                <strong>__MSG_authRequired__</strong>
                <p class="color-fg-muted f6 mt-1 mb-0">__MSG_authDescription__</p>
                <p class="color-fg-muted" style="margin-top: 8px; font-size: 11px">
                  <strong>__MSG_note__:</strong> __MSG_authNote__
                </p>
              </div>
            </div>
          </div>

          <!-- Token Input -->
          <div class="form-group">
            <label class="d-block mb-1 f6" for="github-token">__MSG_tokenLabel__</label>
            <input type="password" id="github-token" class="form-control input-block mb-2" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
            <button id="save-token" class="btn btn-primary btn-block" style="background: #6e40c9; border-color: #6e40c9">
              __MSG_saveToken__
            </button>
          </div>

          <div class="f6 mt-2">
            <a href="https://github.com/settings/tokens/new?scopes=public_repo&description=Better%20GHub" target="_blank" rel="noopener noreferrer" class="Link d-block mb-1">
              __MSG_createToken__
            </a>
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=Better%20GHub" target="_blank" rel="noopener noreferrer" class="Link d-block">
              __MSG_createTokenPrivate__
            </a>
          </div>
        </div>

        <!-- Logged in -->
        <div id="logged-in" style="display: none">
          <div class="Box mb-2">
            <div class="Box-row d-flex flex-items-center">
              <img id="user-avatar" src="" alt="Avatar" class="avatar avatar-4 circle mr-2" />
              <div class="flex-1">
                <div class="text-bold" id="user-name">Loading...</div>
                <div class="d-flex flex-items-center flex-justify-between">
                  <div class="text-small color-fg-muted" id="user-login">@username</div>
                  <div class="text-small">
                    <span class="color-fg-muted">__MSG_rateLimit__</span>
                    <span class="text-bold" id="rate-limit" style="color: #6e40c9">5000</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button id="logout-btn" class="btn btn-block">__MSG_logout__</button>
        </div>
      </div>

      <div id="error-message" class="flash flash-error mt-2" style="display: none"></div>
      <div id="success-message" class="flash flash-success mt-2" style="display: none"></div>

      <div class="mt-1">
        <button id="open-options" class="btn btn-block mb-2">
          <span class="footer-icon octicon-inline mr-1"></span>
          <span>__MSG_openSettings__</span>
        </button>
        <p class="text-center text-small color-fg-muted mb-0">
          __MSG_madeWith__
          <span class="footer-heart octicon-inline mx-1"></span>
          <span>__MSG_forBetterExperience__</span>
        </p>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
